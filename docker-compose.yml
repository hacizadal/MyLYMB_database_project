# MariaDB 11.4 lab instance. Keep this exact major version: online-DDL behaviour differs between versions.
# Configuration comes from .env (see .env.example); defaults below make it work without a .env file.
services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb-lab
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-labpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-schemalab}
    ports:
      # Bound to localhost only: root/labpass must not be reachable from the network.
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_lab_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-1G}
      - --innodb-log-file-size=256M
      - --max-connections=500
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_lab_data:
