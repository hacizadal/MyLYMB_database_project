services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb-lab
    environment:
      MARIADB_ROOT_PASSWORD: labpass
      MARIADB_DATABASE: schemalab
    ports:
      - "3306:3306"
    volumes:
      - mariadb_lab_data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --max-connections=500
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_lab_data:
